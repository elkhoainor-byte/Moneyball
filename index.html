<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moneyball Scouting Engine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        h1 { color: var(--accent); margin-bottom: 5px; }
        p { color: var(--text-muted); margin: 0; }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        label { font-weight: 600; font-size: 0.9rem; }

        input, select, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text-main);
            font-size: 1rem;
        }

        button {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        button:hover { opacity: 0.9; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th { color: var(--accent); font-size: 0.85rem; text-transform: uppercase; }

        .badge {
            background-color: #0284c7;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Moneyball Scouting Engine</h1>
        <p>Motor de similitud para reemplazos tácticos multiclub</p>
    </header>

    <!-- Cargar Datos -->
    <div class="card">
        <div class="form-group">
            <label for="csvFile">1. Cargar archivo de datos (CSV exportado de FBref):</label>
            <input type="file" id="csvFile" accept=".csv">
        </div>
    </div>

    <!-- Parámetros de Búsqueda -->
    <div class="card">
        <div class="grid-2">
            <div class="form-group">
                <label for="targetPlayer">2. Jugador a sustituir:</label>
                <input type="text" id="targetPlayer" placeholder="Ej: Lucas Torró, Koke, Budimir...">
            </div>

            <div class="form-group">
                <label for="clubLevel">3. Perfil de Club Comprador:</label>
                <select id="clubLevel">
                    <option value="all">Cualquier origen (Sin filtro)</option>
                    <option value="top">Top Europa (Ej: Atlético de Madrid)</option>
                    <option value="mid">Nivel Medio / LaLiga (Ej: Osasuna)</option>
                    <option value="low">Económico / Bronce (Ej: Shrewsbury Town)</option>
                </select>
            </div>
        </div>

        <button onclick="calculateSimilarity()">Escanear y Buscar Sustituto</button>
    </div>

    <!-- Resultados -->
    <div class="card" id="resultsCard" style="display:none;">
        <h2>Candidatos Compatibles</h2>
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>Jugador</th>
                    <th>Equipo</th>
                    <th>Edad</th>
                    <th>Compatibilidad</th>
                </tr>
            </thead>
            <tbody>
                <!-- Se rellena dinámicamente con JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Datos de prueba por defecto si no se sube un CSV
    const defaultData = [
        { name: "Lucas Torró", team: "Osasuna", age: 31, aerialWon: 4.2, passCmp: 82.5, tackles: 1.4 },
        { name: "Candidato A (Perfil Torró)", team: "Eibar", age: 24, aerialWon: 4.0, passCmp: 81.0, tackles: 1.5 },
        { name: "Candidato B (Perfil Koke)", team: "Girona", age: 26, aerialWon: 1.1, passCmp: 89.2, tackles: 1.1 },
        { name: "Candidato C (Perfil Económico)", team: "Shrewsbury Town", age: 22, aerialWon: 3.8, passCmp: 78.5, tackles: 1.6 }
    ];

    function calculateSimilarity() {
        const targetName = document.getElementById('targetPlayer').value.trim();
        const resultsTable = document.getElementById('resultsTable').querySelector('tbody');
        const resultsCard = document.getElementById('resultsCard');

        if (!targetName) {
            alert("Por favor, introduce el nombre de un jugador.");
            return;
        }

        // Buscar al jugador objetivo
        const target = defaultData.find(p => p.name.toLowerCase().includes(targetName.toLowerCase()));

        if (!target) {
            alert("Jugador no encontrado en la base de datos de prueba. Intenta con 'Lucas Torró'.");
            return;
        }

        resultsTable.innerHTML = "";

        // Algoritmo simplificado de distancia/similitud
        const candidates = defaultData
            .filter(p => p.name !== target.name)
            .map(player => {
                // Cálculo de diferencia entre métricas clave
                const diffAerial = Math.abs(player.aerialWon - target.aerialWon);
                const diffPass = Math.abs(player.passCmp - target.passCmp) / 10;
                const diffTackles = Math.abs(player.tackles - target.tackles);
                
                const totalDiff = diffAerial + diffPass + diffTackles;
                const matchScore = Math.max(0, Math.round(100 - (totalDiff * 15)));

                return { ...player, matchScore };
            })
            .sort((a, b) => b.matchScore - a.matchScore);

        // Renderizar resultados en la tabla
        candidates.forEach(c => {
            const row = `<tr>
                <td><strong>${c.name}</strong></td>
                <td>${c.team}</td>
                <td>${c.age}</td>
                <td><span class="badge">${c.matchScore}%</span></td>
            </tr>`;
            resultsTable.innerHTML += row;
        });

        resultsCard.style.display = "block";
    }
</script>

</body>
</html>
